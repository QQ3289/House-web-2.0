<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手 - 二手房信息服务平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>二手房信息服务平台</h1>
            <nav>
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="statistics.html">数据统计</a></li>
                    <li><a href="ai-assistant.html">AI助手</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="ai-section">
            <h2>AI购房助手</h2>
            <p class="ai-intro">告诉我您的需求，我将为您推荐最合适的房源</p>
            
            <div class="ai-chat">
                <div class="chat-messages" id="chatMessages">
                    <div class="message bot-message">
                        您好！我是AI购房助手。请告诉我您的购房需求，例如预算、地区偏好、面积要求等，我将为您推荐合适的房源。
                    </div>
                </div>
                
                <div class="chat-input">
                    <textarea id="userInput" placeholder="例如：我想在市中心购买一套两室一厅，预算200-300万..."></textarea>
                    <button id="sendBtn" class="btn-primary">发送</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 二手房信息服务平台. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/ai-assistant.js"></script>
</body>
</html>
