<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手房信息服务平台</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=YOUR_BAIDU_AK"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>二手房信息服务平台</h1>
            <nav>
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="statistics.html">数据统计</a></li>
                    <li><a href="ai-assistant.html">AI助手</a></li>
                    <li><a href="#" id="favoritesLink" style="display:none;">我的收藏</a></li>
                    <li><a href="admin.html" id="adminLink" style="display:none;">管理后台</a></li>
                    <li><a href="login.html" id="loginLink">登录/注册</a></li>
                    <li><a href="#" id="logoutLink" style="display:none;">退出</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <h2>房源筛选</h2>
            <div class="filters">
                <div class="filter-group">
                    <label>价格范围（万元）:</label>
                    <input type="number" id="minPrice" placeholder="最低价">
                    <span>-</span>
                    <input type="number" id="maxPrice" placeholder="最高价">
                </div>
                <div class="filter-group">
                    <label>单价范围（元/㎡）:</label>
                    <input type="number" id="minUnitPrice" placeholder="最低单价">
                    <span>-</span>
                    <input type="number" id="maxUnitPrice" placeholder="最高单价">
                </div>
                <div class="filter-group">
                    <label>面积范围（㎡）:</label>
                    <input type="number" id="minArea" placeholder="最小面积">
                    <span>-</span>
                    <input type="number" id="maxArea" placeholder="最大面积">
                </div>
                <div class="filter-group">
                    <label>地区:</label>
                    <input type="text" id="region" placeholder="输入地区名称">
                </div>
                <div class="filter-group">
                    <label>房型:</label>
                    <input type="text" id="houseType" placeholder="如：两室一厅">
                </div>
                <button id="searchBtn" class="btn-primary">搜索</button>
                <button id="resetBtn" class="btn-secondary">重置</button>
            </div>
        </section>

        <section class="houses-section">
            <h2>房源列表</h2>
            <div id="housesList" class="houses-grid">
                <p class="loading">加载中...</p>
            </div>
            <div class="pagination">
                <button id="prevPage" class="btn-secondary" disabled>上一页</button>
                <span id="pageInfo">第 1 页</span>
                <button id="nextPage" class="btn-secondary">下一页</button>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 二手房信息服务平台. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
