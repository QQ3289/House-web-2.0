<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - 二手房信息服务平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>二手房信息服务平台</h1>
            <nav>
                <ul>
                    <li><a href="index.html">首页</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="auth-section">
            <div class="auth-container">
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">登录</button>
                    <button class="auth-tab" data-tab="register">注册</button>
                </div>

                <div id="loginForm" class="auth-form">
                    <h2>用户登录</h2>
                    <div class="form-group">
                        <label>用户名:</label>
                        <input type="text" id="loginUsername" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label>密码:</label>
                        <input type="password" id="loginPassword" placeholder="请输入密码">
                    </div>
                    <button id="loginBtn" class="btn-primary">登录</button>
                    <div id="loginMessage" class="message"></div>
                </div>

                <div id="registerForm" class="auth-form" style="display:none;">
                    <h2>用户注册</h2>
                    <div class="form-group">
                        <label>用户名:</label>
                        <input type="text" id="registerUsername" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label>邮箱:</label>
                        <input type="email" id="registerEmail" placeholder="请输入邮箱">
                    </div>
                    <div class="form-group">
                        <label>密码:</label>
                        <input type="password" id="registerPassword" placeholder="请输入密码">
                    </div>
                    <div class="form-group">
                        <label>确认密码:</label>
                        <input type="password" id="registerPasswordConfirm" placeholder="再次输入密码">
                    </div>
                    <button id="registerBtn" class="btn-primary">注册</button>
                    <div id="registerMessage" class="message"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 二手房信息服务平台. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
